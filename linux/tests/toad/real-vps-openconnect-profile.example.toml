# Copy to linux/tests/toad/real-vps-openconnect.secret and chmod 0600 it.
# real-vps-openconnect.secret is ignored by git because of the *.secret rule.
# This is the one local file that contains the real OpenConnect credentials.
# Never commit or attach the populated secret file.

gateway = "https://ve.ad-tech.ru/"
vpn_protocol = "anyconnect"
username = "nmkartsev"
password = "PASTE_PASSWORD_FROM_THE_NETWORKMANAGER_PROFILE"
totp_secret = "PASTE_TOTP_SECRET_FROM_THE_NETWORKMANAGER_PROFILE"

mtu = 1380
reconnect_timeout = 300
disable_udp = false
disable_ipv6 = true

# Optional. Leave empty unless the real profile pins the server certificate.
server_cert = ""
user_agent = ""

# Normally leave this empty: the test prefers the DNS servers pushed by the
# OpenConnect server. Fill only if the production server really omits DNS.
dns_servers = []
