[package]
name = "kikimora-vpn"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Kikimora-owned multi-instance VPN runtime"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
