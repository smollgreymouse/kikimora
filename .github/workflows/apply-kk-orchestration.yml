name: Apply kk orchestration patch

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-kk-orchestration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          kikimora = Path('kikimora')
          text = kikimora.read_text()
          text = text.replace(
              '  start                    Start Leshy\n  stop                     Stop Leshy\n  restart                  Restart all services now\n',
              '  start                    Start services and ensure DNS integration\n  stop                     Suspend DNS integration and stop services\n  restart                  Suspend DNS, restart services and ensure DNS integration\n',
              1,
          )
          text = text.replace('  sudo kk dns enable\n', '  sudo kk dns status\n', 1)
          start = text.index('cmd_service() {\n')
          end = text.index('interface_state(){\n', start)
          new_service = '''cmd_dns_resume_or_enable() {
  [[ -x /usr/local/sbin/leshy-dns ]] || die "/usr/local/sbin/leshy-dns not found"
  if /usr/local/sbin/leshy-dns resume; then
    return 0
  fi
  printf 'No saved DNS mode or DNS resume failed; enabling DNS integration.\\n' >&2
  /usr/local/sbin/leshy-dns enable
}

cmd_dns_suspend_if_available() {
  [[ -x /usr/local/sbin/leshy-dns ]] || return 0
  /usr/local/sbin/leshy-dns suspend || true
}

cmd_service() {
  local action="$1"
  shift || true
  require_root

  case "$action" in
    start)
      [[ $# -eq 0 ]] || die "unexpected arguments"
      systemctl start "${MANAGED_UNITS[@]}"
      cmd_dns_resume_or_enable
      ;;
    stop)
      [[ $# -eq 0 ]] || die "unexpected arguments"
      cmd_dns_suspend_if_available
      systemctl stop "${MANAGED_UNITS[@]}"
      ;;
    restart)
      [[ $# -eq 0 ]] || die "unexpected arguments"
      cmd_dns_suspend_if_available
      if ! systemctl restart "${MANAGED_UNITS[@]}"; then
        printf 'Services failed to restart; system DNS remains restored.\\n' >&2
        return 1
      fi
      cmd_dns_resume_or_enable
      ;;
    enable|disable)
      local now=''
      [[ "${1:-}" == --now ]] && { now=--now; shift; }
      [[ $# -eq 0 ]] || die "usage: kk $action [--now]"
      systemctl "$action" ${now:+$now} "${MANAGED_UNITS[@]}"
      ;;
  esac
}
'''
          text = text[:start] + new_service + text[end:]
          text = text.replace(
              "    start|stop|restart|enable|disable|status|interfaces) printf 'Usage: sudo kikimora %s\\n' \"$command\" ;;",
              "    start) printf 'Usage: sudo kikimora start\\nStart services and ensure DNS integration.\\n' ;;\n    stop) printf 'Usage: sudo kikimora stop\\nSuspend DNS integration and stop services.\\n' ;;\n    restart) printf 'Usage: sudo kikimora restart\\nSuspend DNS, restart services and ensure DNS integration.\\n' ;;\n    enable|disable|status|interfaces) printf 'Usage: sudo kikimora %s\\n' \"$command\" ;;",
              1,
          )
          kikimora.write_text(text)

          install = Path('install.sh')
          text = install.read_text()
          check_line = 'grep -Fqx "ExecStartPost=-/bin/sh -c \'/usr/local/sbin/leshy-dns check || /usr/local/sbin/leshy-dns enable\'" "${FILES_DIR}/route-cleanup.conf"'
          anchor = 'grep -Fqx \'ExecStartPost=-/usr/local/sbin/leshy-dns resume\' "${FILES_DIR}/route-cleanup.conf"'
          if check_line not in text:
              text = text.replace(anchor, anchor + '\n' + check_line, 1)
          install.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace(
              'sudo ./install.sh --primary-interface tun0 --secondary-interface tun1\nsudo kk enable --now\n',
              'sudo ./install.sh --primary-interface tun0 --secondary-interface tun1\nsudo kk enable --now\n# or for a one-shot start without enabling autostart:\n# sudo kk start\n',
              1,
          )
          lifecycle = '''### Service lifecycle commands

```bash
sudo kk start
sudo kk stop
sudo kk restart
```

#### `start`

Starts Leshy and its managed watcher services. After the services are running,
Kikimora resumes the saved DNS integration. On a cold start with no saved DNS
state yet, it automatically enables DNS integration, so a separate
`kk dns enable` call is not required.

#### `stop`

Temporarily restores normal system DNS routing and then stops the managed
services. The saved DNS intent is preserved.

#### `restart`

Temporarily restores normal system DNS routing, restarts the managed services,
and then resumes or enables DNS integration again. If the service restart fails,
DNS remains restored instead of pointing at an unavailable local Leshy instance.

'''
          if '### Service lifecycle commands' not in text:
              text = text.replace('### DNS integration command\n', lifecycle + '### DNS integration command\n', 1)
          text = text.replace(
              'Repairs or restores the runtime DNS configuration.\n\nThis command is safe to call when the interface already exists.',
              'Repairs or restores the runtime DNS configuration saved by `kk dns enable`.\n\nThis command is safe to call when the interface already exists.',
              1,
          )
          text = text.replace(
              'Temporarily releases the system from the Leshy DNS configuration so normal DNS\nresolution can continue while Leshy is unavailable.\n',
              'Temporarily releases the system from the Leshy DNS configuration so normal DNS\nresolution can continue while Leshy is unavailable. The saved DNS intent is\npreserved and can be resumed later.\n',
              1,
          )
          readme.write_text(text)

          Path('.github/workflows/apply-kk-orchestration.yml').unlink()
          PY
          bash -n kikimora
          bash -n install.sh
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kikimora install.sh README.md .github/workflows/apply-kk-orchestration.yml
          git diff --cached --quiet && exit 0
          git commit -m "Orchestrate DNS in kk lifecycle"
          git push
