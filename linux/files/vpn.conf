# Template for /etc/kikimora/leshy/vpn.conf.
# install.sh creates the actual file from CLI flags or interactive input.

PRIMARY_INTERFACE="primary0"
PRIMARY_DEVICE_FILE="/run/kikimora/leshy/vpn/primary.dev"
PRIMARY_PROBE_URL="http://1.1.1.1/"

SECONDARY_INTERFACE="secondary0"
SECONDARY_DEVICE_FILE="/run/kikimora/leshy/vpn/secondary.dev"
SECONDARY_PROBE_URL="http://1.1.1.1/"

# A VPN device is published to Leshy only after this many consecutive
# successful data-path probes. A published device is withdrawn after this many
# consecutive probe failures.
VPN_PROBE_TIMEOUT=4
VPN_READY_SUCCESSES=2
VPN_DOWN_FAILURES=3
