name: Managed VPN runtime

on:
  pull_request:
    paths:
      - 'linux/vpn-client/**'
      - 'linux/files/kikimora-vpn@.service'
      - 'linux/tests/vpn-client/**'
      - 'docs/vpn-runtime-*.md'
      - '.github/workflows/vpn-client.yml'
  push:
    branches: [master]
    paths:
      - 'linux/vpn-client/**'
      - 'linux/files/kikimora-vpn@.service'
      - 'linux/tests/vpn-client/**'
      - '.github/workflows/vpn-client.yml'

permissions:
  contents: read

jobs:
  rust-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path linux/vpn-client/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path linux/vpn-client/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path linux/vpn-client/Cargo.toml --all-targets
      - name: ShellCheck namespace harness
        run: shellcheck linux/tests/vpn-client/*.sh

  linux-netns:
    needs: rust-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build client
        run: cargo build --manifest-path linux/vpn-client/Cargo.toml
      - name: Install namespace test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 jq iputils-ping
          sudo modprobe tun || true
          test -c /dev/net/tun
      - name: Isolated real TUN smoke
        run: bash linux/tests/vpn-client/tun-smoke.sh linux/vpn-client/target/debug/kikimora-vpn

  awg2-interop:
    needs: rust-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/checkout@v4
        with:
          repository: amnezia-vpn/amneziawg-go
          ref: b5928efb6ca19f0153958460c3d141f04abc5c2e
          path: .reference/amneziawg-go
      - uses: actions/checkout@v4
        with:
          repository: amnezia-vpn/amneziawg-tools
          ref: ee0f0a9aa34ff0a0da4b3433b9512781cfe02843
          path: .reference/amneziawg-tools
      - name: Build Kikimora and pinned reference peers
        run: |
          cargo build --manifest-path linux/vpn-client/Cargo.toml
          make -C .reference/amneziawg-go amneziawg-go
          make -C .reference/amneziawg-tools/src wg
      - name: Install isolated network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 jq iputils-ping
          sudo modprobe tun || true
          test -c /dev/net/tun
      - name: AWG2 reference interop and recovery
        run: |
          bash linux/tests/vpn-client/awg2-interop.sh \
            linux/vpn-client/target/debug/kikimora-vpn \
            .reference/amneziawg-go/amneziawg-go \
            .reference/amneziawg-tools/src/wg
