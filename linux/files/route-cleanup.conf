[Unit]
Wants=leshy-route-watch.service leshy-health-watch.service

[Service]
ExecStartPre=/usr/local/libexec/kikimora/leshy/reconcile
ExecStartPre=/bin/sh -c 'marker=/run/kikimora/leshy/recovery-restart; if [ -e "$marker" ]; then printf "leshy-recovery: preserving existing route baseline\n" >&2; else exec /usr/local/libexec/kikimora/leshy/route-lifecycle snapshot; fi'
ExecStartPost=-/bin/sh -c 'marker=/run/kikimora/leshy/recovery-restart; if [ -e "$marker" ]; then printf "leshy-recovery: keeping system DNS integration active\n" >&2; else exec /usr/local/sbin/leshy-dns resume; fi'
ExecStartPost=-/bin/sh -c 'marker=/run/kikimora/leshy/recovery-restart; if [ -e "$marker" ]; then :; else /usr/local/sbin/leshy-dns check || /usr/local/sbin/leshy-dns enable; fi'
ExecStartPost=-/bin/sh -c 'marker=/run/kikimora/leshy/recovery-restart; if [ -e "$marker" ] && command -v resolvectl >/dev/null 2>&1; then resolvectl flush-caches >/dev/null 2>&1 && printf "leshy-recovery: systemd-resolved cache flushed\n" >&2; fi'
ExecStartPost=-/bin/sh -c 'marker=/run/kikimora/leshy/recovery-restart; if [ -e "$marker" ]; then rm -f -- "$marker"; printf "leshy-recovery: process-only restart completed\n" >&2; fi'
ExecStopPost=-/bin/sh -c 'marker=/run/kikimora/leshy/recovery-restart; if [ -e "$marker" ]; then printf "leshy-recovery: DNS suspend skipped for process-only restart\n" >&2; else exec /usr/local/sbin/leshy-dns suspend; fi'
ExecStopPost=-/bin/sh -c 'marker=/run/kikimora/leshy/recovery-restart; if [ -e "$marker" ]; then printf "leshy-recovery: route cleanup skipped for process-only restart\n" >&2; else exec /usr/local/libexec/kikimora/leshy/route-lifecycle cleanup; fi'
