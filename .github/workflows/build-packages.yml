name: Build packages

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "toad/**"
      - "desktop/**"
      - "packaging/**"
      - "linux/**"
      - "VERSION"
      # §50: a pin-only change must trigger both package jobs.
      - ".github/workflows/build-packages.yml"
      - ".github/managed-routing-companion.env"

permissions:
  contents: write

jobs:
  # §50.2: .github/managed-routing-companion.env is the single authoritative
  # pin. Downstream jobs read the resolved SHA from this setup job instead of
  # duplicating LESHY_REF in the workflow.
  setup:
    name: Resolve companion pin
    runs-on: ubuntu-latest
    outputs:
      leshy_ref: ${{ steps.pin.outputs.leshy_ref }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        name: Read managed-routing companion pin
        run: |
          set -euo pipefail
          . .github/managed-routing-companion.env
          if [ -z "${LESHY_REF:-}" ]; then
            echo "::error::LESHY_REF is missing from .github/managed-routing-companion.env"
            exit 1
          fi
          echo "leshy_ref=$LESHY_REF" >> "$GITHUB_OUTPUT"

  linux-deb:
    name: Linux deb
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Leshy (steering runtime)
        uses: actions/checkout@v4
        with:
          repository: smollgreymouse/leshy
          ref: ${{ needs.setup.outputs.leshy_ref }}
          path: leshy

      - name: Assert Leshy companion pin (§50.3)
        working-directory: leshy
        run: |
          resolved="$(git rev-parse HEAD)"
          echo "leshy pinned SHA: $resolved"
          if [ "$resolved" != "${{ needs.setup.outputs.leshy_ref }}" ]; then
            echo "::error::Leshy checkout $resolved does not match the pin ${{ needs.setup.outputs.leshy_ref }}"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install Rust (Leshy build)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Qt for UI
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          modules: "qtshadertools"
          cache: true

      - name: Build deb + tar.gz
        env:
          KIKIMORA_LESHY_SRC: ${{ github.workspace }}/leshy
          KIKIMORA_UI_BIN: ${{ github.workspace }}/build/desktop/kikimora-ui
        run: |
          cmake -S desktop -B build/desktop -DCMAKE_BUILD_TYPE=Release
          cmake --build build/desktop --target kikimora-ui --parallel
          ./packaging/linux/build-release.sh

      - name: Packaging contract test
        env:
          KIKIMORA_LESHY_SRC: ${{ github.workspace }}/leshy
        run: bash linux/tests/test_release_packaging.sh

      - uses: actions/upload-artifact@v4
        with:
          name: kikimora-linux
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS

  windows-msi:
    name: Windows MSI + zip
    needs: setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          modules: "qtshadertools"
          cache: true
          setup-only: false

      - name: Install WiX 3.11
        run: |
          $zip = "$env:RUNNER_TEMP\wix311.zip"
          Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\wix311"
          Add-Content $env:GITHUB_ENV "WIX_BIN=$env:RUNNER_TEMP\wix311"

      - name: Download wintun.dll
        run: |
          $url = 'https://www.wintun.net/builds/wintun-0.14.1.zip'
          $zip = "$env:RUNNER_TEMP\wintun.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\wintun"
          New-Item -ItemType Directory -Force -Path packaging\windows\files\wintun | Out-Null
          Copy-Item "$env:RUNNER_TEMP\wintun\wintun\bin\amd64\wintun.dll" packaging\windows\files\wintun\wintun.dll

      - name: Checkout Leshy (steering runtime)
        uses: actions/checkout@v4
        with:
          repository: smollgreymouse/leshy
          ref: ${{ needs.setup.outputs.leshy_ref }}
          path: leshy-win

      - name: Assert Leshy companion pin (§50.3)
        working-directory: leshy-win
        shell: pwsh
        run: |
          $resolved = (git rev-parse HEAD).Trim()
          Write-Host "leshy pinned SHA: $resolved"
          if ($resolved -ne "${{ needs.setup.outputs.leshy_ref }}") {
            Write-Error "Leshy checkout $resolved does not match the pin ${{ needs.setup.outputs.leshy_ref }}"
            exit 1
          }

      - name: Install Rust (Leshy build)
        uses: dtolnay/rust-toolchain@stable

      - name: Build leshy.exe
        run: cargo build --release --manifest-path leshy-win/Cargo.toml

      - name: Stage Leshy payload
        run: |
          New-Item -ItemType Directory -Force -Path tmp\leshy-payload | Out-Null
          Copy-Item leshy-win\target\release\leshy.exe tmp\leshy-payload\leshy.exe

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build UI (MSVC Release)
        run: |
          cmake -S desktop -B build\desktop-release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR\msvc2022_64"
          cmake --build build\desktop-release --config Release --parallel

      - name: Build MSI + portable zip
        shell: pwsh
        run: |
          & packaging\windows\stage.ps1 -OutDir packaging\windows\dist `
            -UiExe build\desktop-release\kikimora-ui.exe `
            -QtDir "$env:QT_ROOT_DIR" `
            -LeshyDir tmp\leshy-payload

      - name: Package contract test
        shell: pwsh
        run: |
          & packaging\windows\test_package.ps1 -OutDir packaging\windows\dist-test

      - uses: actions/upload-artifact@v4
        with:
          name: kikimora-windows
          path: |
            packaging/windows/dist/*.msi
            packaging/windows/dist/*.zip
          if-no-files-found: error
