# Desktop UI / UI↔core contract gate (U7, docs/roadmap.md §14).
#
# This is a test/coverage workflow, not a release-artifact owner: release
# packages are built only by .github/workflows/build-packages.yml. Every OS
# runs Layer A/B/C through the required-suite wrapper, which fails on any
# mandatory QSKIP or unexpected QML warning — a bare "ctest 9/9 passed" is
# not acceptance evidence.
name: Desktop UI

on:
  pull_request:
    paths:
      - "desktop/**"
      - "toad/**"
      - "VERSION"
      - ".github/managed-routing-companion.env"
      - ".github/workflows/desktop-ui.yml"
  push:
    branches:
      - master
    paths:
      - "desktop/**"
      - "toad/**"
      - "VERSION"
      - ".github/managed-routing-companion.env"
      - ".github/workflows/desktop-ui.yml"
  workflow_dispatch:

jobs:
  companion-pin:
    name: Resolve companion pin
    runs-on: ubuntu-latest
    outputs:
      leshy_ref: ${{ steps.pin.outputs.leshy_ref }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        name: Read managed-routing companion pin
        run: |
          set -euo pipefail
          . .github/managed-routing-companion.env
          if [ -z "${LESHY_REF:-}" ]; then
            echo "::error::LESHY_REF is missing from .github/managed-routing-companion.env"
            exit 1
          fi
          if ! printf '%s' "$LESHY_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::LESHY_REF must be exactly 40 lowercase hex characters, got: '$LESHY_REF'"
            exit 1
          fi
          echo "leshy_ref=$LESHY_REF" >> "$GITHUB_OUTPUT"
          echo "resolved companion pin: $LESHY_REF"

  suites:
    name: ${{ matrix.os }}
    needs: companion-pin
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Print exact source SHA
        run: |
          git rev-parse HEAD
          echo "desktop-ui gate on $(git rev-parse HEAD)"

      # The companion Leshy checkout is part of the contract surface even
      # though this workflow does not build it: the pin is verified so a
      # changed companion ref is what re-runs this gate.
      - name: Verify Leshy companion pin
        shell: bash
        run: |
          set -euo pipefail
          echo "companion pin under verification: ${{ needs.companion-pin.outputs.leshy_ref }}"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          modules: "qtshadertools"
          cache: true

      # LinguistTools ships with the Qt install (aqt default); the
      # translation test is mandatory — its QSKIP fails the gate through the
      # wrapper, so a missing installation surfaces here and not in release.

      - name: Configure
        run: cmake -S desktop -B build/desktop-ui -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/desktop-ui --config Release --parallel 3

      - name: Go contract tests for the UI-facing API
        working-directory: toad
        shell: bash
        run: go test ./internal/control ./internal/config ./cmd/kikimora-core

      - name: Required suites (Layer A/B/C, fail on skip/warning)
        if: runner.os != 'Windows'
        shell: bash
        run: desktop/tests/run-required-suites.sh build/desktop-ui

      - name: Required suites (Layer A/B/C, fail on skip/warning)
        if: runner.os == 'Windows'
        shell: pwsh
        run: desktop/tests/run-required-suites.ps1 -BuildDir build/desktop-ui

      - name: Offscreen QML smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software timeout 3s ./build/desktop-ui/kikimora-ui >ui-smoke.log 2>&1
          rc=$?
          cat ui-smoke.log
          if grep -E "QQmlApplicationEngine failed|ReferenceError|TypeError|Binding loop|required property|qrc:/qml/.*:[0-9]+:" ui-smoke.log; then
            exit 1
          fi
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            exit "$rc"
          fi

      - name: Upload suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-logs-${{ matrix.os }}
          path: build/desktop-ui/required-suite-logs/
          if-no-files-found: error
