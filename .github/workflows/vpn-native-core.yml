name: VPN native core

on:
  push:
    paths:
      - 'vpn-native/**'
      - 'docs/vpn-native-core-**'
      - '.github/workflows/vpn-native-core.yml'
  pull_request:
    paths:
      - 'vpn-native/**'
      - 'docs/vpn-native-core-**'
      - '.github/workflows/vpn-native-core.yml'

jobs:
  go-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vpn-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: vpn-native/go.mod
      - name: Download dependencies
        run: go mod download
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
