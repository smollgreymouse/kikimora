name: Toad core

on:
  push:
    paths:
      - 'toad/**'
      - 'linux/tests/toad/**'
      - 'packaging/windows/**'
      - 'docs/toad-**'
      - '.gitattributes'
      - '.github/workflows/toad.yml'
  pull_request:
    paths:
      - 'toad/**'
      - 'linux/tests/toad/**'
      - 'packaging/windows/**'
      - 'docs/toad-**'
      - '.gitattributes'
      - '.github/workflows/toad.yml'

jobs:
  go-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: toad
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: toad/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check formatting
        run: |
          gofmt -d .
          test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build core CLI
        run: go build ./cmd/kikimora-core
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...

  # Build every binary used by Linux namespace/interoperability gates once.
  # The individual jobs below only download this artifact; this keeps the
  # tested Toad/core/reference revisions identical and avoids rebuilding the
  # same dependency graph in every smoke job.
  linux-smoke-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: toad/go.sum
      - name: Download dependencies
        working-directory: toad
        run: go mod download
      - name: Build shared Linux smoke artifact
        working-directory: toad
        run: |
          mkdir -p "$RUNNER_TEMP/toad-smoke"
          go build -o "$RUNNER_TEMP/toad-smoke/kikimora-toad" ./cmd/kikimora-toad
          go build -o "$RUNNER_TEMP/toad-smoke/kikimora-core" ./cmd/kikimora-core
          go build -o "$RUNNER_TEMP/toad-smoke/ready-toad" ./internal/testtoad/cmd/ready-toad
          go build -o "$RUNNER_TEMP/toad-smoke/routeprobe" ./internal/control/testhelper/routeprobe
          go build -o "$RUNNER_TEMP/toad-smoke/toad-tun-test-helper" ./internal/platform/testhelper
          go build -o "$RUNNER_TEMP/toad-smoke/toad-awg2-test-helper" ./internal/backend/awg2/testhelper
          go build -o "$RUNNER_TEMP/toad-smoke/toad-route-parking-test-helper" ./internal/platform/linux/netlink/testhelper
          go build -o "$RUNNER_TEMP/toad-smoke/amneziawg-go-ref" github.com/amnezia-vpn/amneziawg-go/v3
          go build -o "$RUNNER_TEMP/toad-smoke/xray-ref" github.com/xtls/xray-core/main
          go build -o "$RUNNER_TEMP/toad-smoke/xray-test-cover" ./internal/backend/xray/testcover
          chmod 0755 "$RUNNER_TEMP/toad-smoke"/*
          go version -m "$RUNNER_TEMP/toad-smoke/kikimora-toad" \
            | grep -F 'github.com/xtls/xray-core' \
            | grep -F 'v1.260327.1-0.20260728075948-5ca6f4b7d4dc'
          go version -m "$RUNNER_TEMP/toad-smoke/amneziawg-go-ref" \
            | grep -F 'github.com/amnezia-vpn/amneziawg-go/v3' \
            | grep -F 'v3.1.20260828'
          go version -m "$RUNNER_TEMP/toad-smoke/xray-ref" \
            | grep -F 'github.com/xtls/xray-core' \
            | grep -F 'v1.260327.1-0.20260728075948-5ca6f4b7d4dc'
      - uses: actions/upload-artifact@v4
        with:
          name: kikimora-linux-smoke-binaries
          path: ${{ runner.temp }}/toad-smoke
          if-no-files-found: error

  # R7 §9.2: the tagged Phase F job runs the focused failpoint suites and
  # proves both test-build binaries compile.
  phase-f-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toad
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: toad/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Tagged recovery barrier tests
        run: go test -count=1 -tags kikimora_test_failpoints ./internal/core -run 'RecoveryBarrier|RecoveryStepBarrier' -v
      - name: Tagged managed-recovery trigger tests
        run: go test -count=1 -tags kikimora_test_failpoints ./internal/control -run 'TestTriggerManagedRecovery|TestControlMethod' -v
      - name: Build the tagged core
        run: go build -tags kikimora_test_failpoints ./cmd/kikimora-core
      - name: Build the tagged ready-toad
        run: go build -tags kikimora_test_failpoints ./internal/testtoad/cmd/ready-toad

  # R7 §9.3: the release binary must not contain the tagged trigger or the
  # barrier environment protocol, and a running untagged core must reject the
  # test method as unsupported.
  release-absence:
    needs: linux-smoke-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: toad/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: kikimora-linux-smoke-binaries
          path: ${{ runner.temp }}/toad-smoke
      - name: Build the release core
        working-directory: toad
        run: go build -o "$RUNNER_TEMP/kikimora-core-release" ./cmd/kikimora-core
      - name: Symbol and string absence proof
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/kikimora-core-release"
          if go tool nm "$BIN" | grep -q 'TestTriggerManagedRecovery'; then
            echo "::error::the release binary exposes TestTriggerManagedRecovery"
            exit 1
          fi
          for symbol in TestTriggerManagedRecovery KK_RECOVERY_BARRIER_STEP KK_RECOVERY_BARRIER_ROLE KK_RECOVERY_BARRIER_DIR; do
            if strings "$BIN" | grep -qF "$symbol"; then
              echo "::error::the release binary contains the string $symbol"
              exit 1
            fi
          done
          echo "release-absence: no trigger/barrier protocol in the release binary"
      - name: A running untagged core rejects the test method
        run: |
          set -euo pipefail
          chmod 0755 "$RUNNER_TEMP/toad-smoke"/*
          ROOT="$RUNNER_TEMP/release-absence"
          mkdir -p "$ROOT/config" "$ROOT/state"
          cat > "$ROOT/config/absence.toml" <<'TOML'
          name = "absence"
          protocol = "openconnect"
          interface = "kkabsence0"
          mtu = 1380
          state_dir = "ROOT/state/absence"

          [openconnect]
          gateway = "203.0.113.1"
          username = "absence"
          TOML
          sed -i "s#ROOT#$ROOT#g" "$ROOT/config/absence.toml"
          "$RUNNER_TEMP/toad-smoke/kikimora-core" serve \
            --socket "$ROOT/core.sock" \
            --state-dir "$ROOT/state" \
            --config-dir "$ROOT/config" > "$ROOT/core.log" 2>&1 &
          CORE_PID=$!
          trap 'kill "$CORE_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            "$RUNNER_TEMP/toad-smoke/kikimora-core" wait-startup --socket "$ROOT/core.sock" --timeout 1s >/dev/null 2>&1 && break
            sleep 1
          done
          "$RUNNER_TEMP/toad-smoke/kikimora-core" wait-startup --socket "$ROOT/core.sock" --timeout 10s >/dev/null
          set +e
          "$RUNNER_TEMP/toad-smoke/routeprobe" --socket "$ROOT/core.sock" call \
            --method TestTriggerManagedRecovery --role absence > "$ROOT/trigger.out" 2>&1
          RC=$?
          set -e
          cat "$ROOT/trigger.out"
          if [[ $RC -eq 0 ]]; then
            echo "::error::the untagged core accepted the test method"
            exit 1
          fi
          if ! grep -q 'unsupported method' "$ROOT/trigger.out"; then
            echo "::error::the rejection was not the unsupported-method failure"
            exit 1
          fi
          echo "release-absence: the running untagged core rejected the test method"

  linux-tun-owner:
    needs: linux-smoke-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kikimora-linux-smoke-binaries
          path: ${{ runner.temp }}/toad-smoke
      - name: Prepare shared smoke artifact
        run: chmod 0755 "$RUNNER_TEMP/toad-smoke"/*
      - name: Ensure TUN device node exists
        run: |
          if [[ ! -c /dev/net/tun ]]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200
          fi
      - name: Run isolated TUN ownership gate
        run: |
          sudo env TOAD_TUN_HELPER="$RUNNER_TEMP/toad-smoke/toad-tun-test-helper" \
            bash linux/tests/toad/tun-owner-netns.sh

  linux-go-route-parking:
    needs: linux-smoke-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kikimora-linux-smoke-binaries
          path: ${{ runner.temp }}/toad-smoke
      - name: Prepare shared smoke artifact
        run: chmod 0755 "$RUNNER_TEMP/toad-smoke"/*
      - name: Run Go IPv4 and IPv6 fail-closed parking gate
        run: |
          sudo env PARKING_HELPER="$RUNNER_TEMP/toad-smoke/toad-route-parking-test-helper" \
            bash linux/tests/toad/route-parking-netns.sh

  linux-awg2-attachment:
    needs: linux-smoke-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kikimora-linux-smoke-binaries
          path: ${{ runner.temp }}/toad-smoke
      - name: Prepare shared smoke artifact
        run: chmod 0755 "$RUNNER_TEMP/toad-smoke"/*
      - name: Ensure TUN device node exists
        run: |
          if [[ ! -c /dev/net/tun ]]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200
          fi
      - name: Run isolated official AWG2 attachment gate
        run: |
          sudo env \
            TOAD_AWG2_HELPER="$RUNNER_TEMP/toad-smoke/toad-awg2-test-helper" \
            TOAD_BIN="$RUNNER_TEMP/toad-smoke/kikimora-toad" \
            bash linux/tests/toad/awg2-attachment-netns.sh

  linux-awg2-interop:
    needs: linux-smoke-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kikimora-linux-smoke-binaries
          path: ${{ runner.temp }}/toad-smoke
      - name: Prepare shared smoke artifact
        run: chmod 0755 "$RUNNER_TEMP/toad-smoke"/*
      - name: Ensure TUN device node exists
        run: |
          if [[ ! -c /dev/net/tun ]]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200
          fi
      - name: Run isolated official AWG2 client server gate
        run: |
          sudo env \
            TOAD_BIN="$RUNNER_TEMP/toad-smoke/kikimora-toad" \
            AWG_REF_BIN="$RUNNER_TEMP/toad-smoke/amneziawg-go-ref" \
            bash linux/tests/toad/awg2-interop.sh

  linux-xray-lifecycle:
    needs: linux-smoke-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kikimora-linux-smoke-binaries
          path: ${{ runner.temp }}/toad-smoke
      - name: Prepare shared smoke artifact
        run: chmod 0755 "$RUNNER_TEMP/toad-smoke"/*
      - name: Ensure TUN device node exists
        run: |
          if [[ ! -c /dev/net/tun ]]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200
          fi
      - name: Run isolated official Xray lifecycle gate
        run: |
          sudo env TOAD_BIN="$RUNNER_TEMP/toad-smoke/kikimora-toad" \
            bash linux/tests/toad/xray-lifecycle-netns.sh

  linux-xray-interop:
    needs: linux-smoke-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kikimora-linux-smoke-binaries
          path: ${{ runner.temp }}/toad-smoke
      - name: Prepare shared smoke artifact
        run: chmod 0755 "$RUNNER_TEMP/toad-smoke"/*
      - name: Ensure TUN device node exists
        run: |
          if [[ ! -c /dev/net/tun ]]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200
          fi
      - name: Run isolated official Xray REALITY Vision gate
        run: |
          sudo env \
            TOAD_BIN="$RUNNER_TEMP/toad-smoke/kikimora-toad" \
            XRAY_REF_BIN="$RUNNER_TEMP/toad-smoke/xray-ref" \
            XRAY_COVER_BIN="$RUNNER_TEMP/toad-smoke/xray-test-cover" \
            bash linux/tests/toad/xray-interop.sh

  linux-openconnect-interop:
    needs: linux-smoke-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kikimora-linux-smoke-binaries
          path: ${{ runner.temp }}/toad-smoke
      - name: Prepare shared smoke artifact
        run: chmod 0755 "$RUNNER_TEMP/toad-smoke"/*
      - name: Install official OpenConnect protocol tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openconnect ocserv
          openconnect --version
          ocserv --version
      - name: Ensure TUN device node exists
        run: |
          if [[ ! -c /dev/net/tun ]]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200
          fi
      - name: Run isolated OpenConnect to ocserv gate
        run: |
          sudo env \
            TOAD_BIN="$RUNNER_TEMP/toad-smoke/kikimora-toad" \
            OPENCONNECT_BIN="$(command -v openconnect)" \
            OCSERV_BIN="$(command -v ocserv)" \
            bash linux/tests/toad/openconnect-interop.sh

  linux-multi-toad-interop:
    needs: linux-smoke-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kikimora-linux-smoke-binaries
          path: ${{ runner.temp }}/toad-smoke
      - name: Prepare shared smoke artifact
        run: chmod 0755 "$RUNNER_TEMP/toad-smoke"/*
      - name: Install official OpenConnect protocol tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openconnect ocserv
          openconnect --version
          ocserv --version
      - name: Ensure TUN device node exists
        run: |
          if [[ ! -c /dev/net/tun ]]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200
          fi
      - name: Run simultaneous three-Toad isolation gate
        run: |
          sudo env \
            TOAD_BIN="$RUNNER_TEMP/toad-smoke/kikimora-toad" \
            AWG_REF_BIN="$RUNNER_TEMP/toad-smoke/amneziawg-go-ref" \
            XRAY_REF_BIN="$RUNNER_TEMP/toad-smoke/xray-ref" \
            XRAY_COVER_BIN="$RUNNER_TEMP/toad-smoke/xray-test-cover" \
            OPENCONNECT_BIN="$(command -v openconnect)" \
            OCSERV_BIN="$(command -v ocserv)" \
            bash linux/tests/toad/multi-toad-interop.sh

  linux-service-cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate service and ownership contract
        run: bash linux/tests/toad/service-cutover.sh
      - name: Exercise cutover rollback fixture
        run: bash linux/tests/toad/orchestration-cutover.sh

  # R7 §9.5/§9.6: the shared DNS fixtures self-test, the denial smoke on the
  # shared fixtures and the managed-success hosted suite, all against the
  # exact pinned Leshy companion (read from .github/managed-routing-companion.env).
  linux-managed-smokes:
    needs: linux-smoke-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the companion pin
        id: pin
        run: |
          set -euo pipefail
          LESHY_REF="$(grep -E '^LESHY_REF=' .github/managed-routing-companion.env | cut -d= -f2 | tr -d '[:space:]')"
          if [ -z "$LESHY_REF" ]; then
            echo "::error::LESHY_REF is missing from .github/managed-routing-companion.env"
            exit 1
          fi
          echo "leshy_ref=$LESHY_REF" >> "$GITHUB_OUTPUT"
          echo "resolved companion pin: $LESHY_REF"
      - name: Check out the pinned Leshy
        uses: actions/checkout@v4
        with:
          repository: smollgreymouse/leshy
          ref: ${{ steps.pin.outputs.leshy_ref }}
          path: leshy
      - name: Verify the pinned checkout
        run: |
          resolved="$(git -C leshy rev-parse HEAD)"
          echo "leshy pinned SHA: $resolved"
          if [ "$resolved" != "${{ steps.pin.outputs.leshy_ref }}" ]; then
            echo "::error::Leshy checkout $resolved does not match the pin ${{ steps.pin.outputs.leshy_ref }}"
            exit 1
          fi
      - name: Install Rust (Leshy build)
        uses: dtolnay/rust-toolchain@stable
      - name: Build the pinned Leshy
        working-directory: leshy
        run: cargo build --release --locked
      - uses: actions/download-artifact@v4
        with:
          name: kikimora-linux-smoke-binaries
          path: ${{ runner.temp }}/toad-smoke
      - name: Prepare binaries
        run: |
          chmod 0755 "$RUNNER_TEMP/toad-smoke"/*
          chmod 0755 leshy/target/release/leshy
          python3 linux/tests/toad/fixtures/test_dns_fixtures.py
      - name: Run the shared-fixture denial smoke
        run: |-
          sudo -E env \
            KK_CORE_BIN="$RUNNER_TEMP/toad-smoke/kikimora-core" \
            KK_LESHY_BIN="$GITHUB_WORKSPACE/leshy/target/release/leshy" \
            bash linux/tests/toad/managed-leshy-smoke.sh
      - name: Run the managed-success hosted suite
        run: |
          sudo env \
            KK_BIN="$RUNNER_TEMP/toad-smoke/kikimora-core" \
            READY_TOAD="$RUNNER_TEMP/toad-smoke/ready-toad" \
            LESHY_BIN="$GITHUB_WORKSPACE/leshy/target/release/leshy" \
            ROUTEPROE="$RUNNER_TEMP/toad-smoke/routeprobe" \
            bash linux/tests/toad/managed-leshy-routing-netns.sh \
              --core "$RUNNER_TEMP/toad-smoke/kikimora-core" \
              --ready-toad "$RUNNER_TEMP/toad-smoke/ready-toad" \
              --leshy "$GITHUB_WORKSPACE/leshy/target/release/leshy" \
              --routeprobe "$RUNNER_TEMP/toad-smoke/routeprobe" \
              --suite hosted

  windows-cross-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: toad
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: toad/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Cross-build linux/amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/kikimora-core ./cmd/kikimora-toad
      - name: Cross-build darwin/arm64
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./cmd/kikimora-core ./cmd/kikimora-toad
      - name: Cross-build darwin/amd64
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build ./cmd/kikimora-core ./cmd/kikimora-toad
      - name: Native windows/amd64 build
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./cmd/kikimora-core ./cmd/kikimora-toad
      # R7 §9.4: the Windows ready-toad acceptance fixture must build, but it
      # never ships in a release package.
      - name: Build the Windows ready-toad fixture
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o ready-toad.exe ./internal/testtoad/cmd/ready-toad

  windows-package-contract:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: toad/go.sum
      - name: Download WiX v3
        run: |
          $wixDir = Join-Path $Env:USERPROFILE "Tools\wix311"
          New-Item -ItemType Directory -Force -Path $wixDir | Out-Null
          $zip = Join-Path $Env:RUNNER_TEMP "wix311.zip"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $wixDir -Force
          $Env:WIX_BIN = $wixDir
          "WIX_BIN=$wixDir" >> $Env:GITHUB_ENV
      - name: Run Windows package contract test
        env:
          WIX_BIN: ${{ env.WIX_BIN }}
        run: powershell -File packaging/windows/test_package.ps1
