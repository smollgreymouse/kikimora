# Kikimora orchestration ownership (single-writer migration guard).
# Valid values: legacy or go. The installer never overwrites operator edits:
# this file is laid down only when missing and survives upgrade and uninstall.
# The product runtime is Go-only: the default owns routing and tunnels so
# desired-state restore and bounded automatic recovery work out of the box.
# An operator who needs the fail-closed migration gate stages legacy/external
# here explicitly.
routing_owner = "go"
tunnel_owner = "go"
endpoint_owner = "go"
