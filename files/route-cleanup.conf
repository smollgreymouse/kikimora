[Unit]
Wants=leshy-route-watch.service leshy-health-watch.service

[Service]
ExecStartPre=/usr/local/libexec/kikimora/leshy/reconcile
ExecStartPre=/usr/local/libexec/kikimora/leshy/route-lifecycle snapshot
ExecStartPost=/usr/local/sbin/leshy-dns resume
ExecStopPost=-/usr/local/sbin/leshy-dns suspend
ExecStopPost=-/usr/local/libexec/kikimora/leshy/route-lifecycle cleanup
