[package]
name = "kikimora-vpn"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
description = "Kikimora-owned multi-instance VPN runtime"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
libc = "0.2"
nblib-awg = { package = "Wireguard-W-RS", git = "https://github.com/RunaRoo/AmneziaWG-RS.git", rev = "51579a7d6e8882d1d8d6d00822f09e18a9423b73", default-features = false, features = ["amnezia"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["v4"] }
xray-config = { git = "https://github.com/aimalygin/xray-rust.git", rev = "87b950a842fd741405246c0949a37d2c4ae32341" }
xray-core-rs = { git = "https://github.com/aimalygin/xray-rust.git", rev = "87b950a842fd741405246c0949a37d2c4ae32341" }

[dev-dependencies]
tempfile = "3"
