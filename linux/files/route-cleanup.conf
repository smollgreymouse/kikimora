# Legacy-runtime drop-in for leshy.service (route-watch / health-watch modes).
# The DNS integration hooks deliberately live in kikimora-leshy-dns.service:
# as an ExecStartPost of leshy.service they ran while the unit was still
# activating, so leshy-dns refused to enable the resolver and the failure was
# hidden by the leading "-".
[Unit]
Wants=leshy-route-watch.service leshy-health-watch.service

[Service]
ExecStartPre=/usr/local/libexec/kikimora/leshy/reconcile
ExecStartPre=/usr/local/libexec/kikimora/leshy/route-lifecycle snapshot
ExecStopPost=-/usr/local/libexec/kikimora/leshy/route-lifecycle cleanup
