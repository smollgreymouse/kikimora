# Kikimora orchestration ownership (single-writer migration guard).
# Valid values: legacy or go. The installer never overwrites operator edits:
# this file is laid down only when missing and survives upgrade and uninstall.
# Staging routing_owner = "go" together with tunnel_owner = "go" enables
# bounded automatic recovery and desired-state restore on next service start.
routing_owner = "legacy"
tunnel_owner = "external"
endpoint_owner = "legacy"
